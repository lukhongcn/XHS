<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <style>
    text{font-family:'Microsoft YaHei',sans-serif;fill:#222;font-size:16px}
    .title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:13px}
    .line{stroke:#333;stroke-width:2;fill:none}.grid{stroke:#d9d9d9;stroke-width:1}
    .ok{stroke:#2e7d32;stroke-width:3;fill:none}.fail{stroke:#c62828;stroke-width:3;fill:none}
    .box{fill:#eef5fb;stroke:#6d9dc1;stroke-width:1.5}.note{fill:#fff8df;stroke:#c9aa45}
  </style>
  <text x="750" y="36" text-anchor="middle" class="title">S7client 二维码检测与结果保存时序图</text>
  <text x="35" y="88" class="label">参与方</text>
  <text x="245" y="88" class="label">PLC</text><text x="535" y="88" class="label">S7client</text><text x="825" y="88" class="label">SQL Server</text><text x="1115" y="88" class="label">PLCResult.txt</text>
  <line x1="245" y1="105" x2="245" y2="700" class="line"/><line x1="535" y1="105" x2="535" y2="700" class="line"/><line x1="825" y1="105" x2="825" y2="700" class="line"/><line x1="1115" y1="105" x2="1115" y2="700" class="line"/>
  <line x1="40" y1="145" x2="1450" y2="145" class="grid"/><text x="55" y="140" class="small">T0</text><text x="260" y="135">PLC心跳翻转</text><text x="550" y="135">MES心跳翻转，监控持续运行</text>
  <line x1="40" y1="225" x2="1450" y2="225" class="grid"/><text x="55" y="220" class="small">T1</text><path d="M245 210 L535 210" class="ok"/><polygon points="535,210 520,203 520,217" fill="#2e7d32"/><text x="275" y="198">允许读取测试：266.4=1</text>
  <line x1="40" y1="315" x2="1450" y2="315" class="grid"/><text x="55" y="310" class="small">T2</text><path d="M245 300 L535 300" class="line"/><polygon points="535,300 520,293 520,307" fill="#333"/><text x="275" y="288">DB50.2.0二维码，266.1=1</text>
  <line x1="40" y1="405" x2="1450" y2="405" class="grid"/><text x="55" y="400" class="small">T3</text><path d="M535 390 L825 390" class="line"/><polygon points="825,390 810,383 810,397" fill="#333"/><text x="575" y="378">查询 partno_id + QMJC + Ready</text>
  <path d="M535 430 L1115 430" class="line"/><polygon points="1115,430 1100,423 1100,437" fill="#333"/><text x="650" y="418">数据库失败时追加 PLCResult.txt</text>
 <line x1="40" y1="515" x2="1450" y2="515" class="grid"/><text x="55" y="510" class="small">T4</text><path d="M535 500 L245 500" class="ok"/><polygon points="245,500 260,493 260,507" fill="#2e7d32"/><text x="280" y="488">266.5=1，266.6=0（数据库或本地保存成功）</text>
 <path d="M535 540 L245 540" class="fail"/><polygon points="245,540 260,533 260,547" fill="#c62828"/><text x="280" y="565">266.5=0，266.6=1（数据库和本地文件都失败）</text>
  <line x1="40" y1="635" x2="1450" y2="635" class="grid"/><text x="55" y="630" class="small">T5</text><rect x="520" y="655" width="650" height="55" rx="8" class="note"/><text x="545" y="680">读取测试：不停止心跳，不修改266.2/266.3；</text><text x="545" y="700">二维码为空时再读DB50.2.0，仍为空则要求输入二维码。</text>
</svg>
